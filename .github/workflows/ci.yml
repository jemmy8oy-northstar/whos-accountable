name: CI

# Runs on every pull request, into any branch — so a feature -> dev merge is
# gated by the same suite that gates a dev -> main promotion.
#
# Job ids double as the required status-check contexts named in the branch
# ruleset — rename one and that required check hangs forever.
#
# There is deliberately no `frontend` or `e2e` job: this repo is backend-only.
# The template's frontend job ran `npm ci` inside a ./frontend directory that
# has never existed here, so CI failed on every run from the initial commit
# until now. Add those jobs back in the PR that adds the frontend.
on:
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ./backend

      - name: Build
        run: dotnet build ./backend --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test ./backend
          --no-build
          --configuration Release
          --verbosity normal
