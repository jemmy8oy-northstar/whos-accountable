name: CI

# Runs on every pull request, into any branch — so a feature -> dev merge is
# gated by the same suite that gates a dev -> main promotion.
#
# Job ids double as the required status-check contexts named in the branch
# ruleset — rename one and that required check hangs forever.
#
# The `frontend` job came back with the leaderboard frontend (BEH-LEADER-1/2).
# There is still no `e2e` job: the frontend has no Playwright suite yet.
on:
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ./backend

      - name: Build
        run: dotnet build ./backend --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test ./backend
          --no-build
          --configuration Release
          --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ./frontend

      - name: Lint
        run: npm run lint
        working-directory: ./frontend

      - name: Build
        run: npm run build
        working-directory: ./frontend

      - name: Test
        run: npm run test
        working-directory: ./frontend
